<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Login Seguro</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="pagina-login">

<main class="cartao-login">
    <h1>Login Seguro</h1>
    <p>Entre com seu e-mail para continuar.</p>

    <form th:action="@{/login}" method="post" class="formulario-login">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email"
               placeholder="seuemail@exemplo.com"
               autocomplete="username" required autofocus>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="password"
               placeholder="Digite sua senha"
               autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>

    <p class="mensagem-erro" th:if="${param.error}">
        E-mail ou senha incorretos.
    </p>

    <p class="mensagem-sucesso" th:if="${param.logout}">
        Você saiu do sistema com segurança.
    </p>

    <p class="link-cadastro">
        Ainda não tem uma conta?
        <a th:href="@{/cadastro}">Cadastre-se</a>
    </p>
</main>

</body>
</html>
