<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>

<h1>Criar conta</h1>

<form th:action="@{/cadastro}" th:object="${usuario}" method="post">

    <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}">
        <p th:if="${#fields.hasErrors('nome')}"
           th:errors="*{nome}"></p>
    </div>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}">
        <p th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>
    </div>

    <div>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" th:field="*{senha}">
        <p th:if="${#fields.hasErrors('senha')}"
           th:errors="*{senha}"></p>
    </div>

    <button type="submit">Cadastrar</button>

</form>

<p>Já tem uma conta? <a th:href="@{/login}">Entrar</a></p>

</body>
</html>
